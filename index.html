<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Zorrito dulce 🦊</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    height: 100%;
    overflow-x: hidden;
    overflow-y: auto; /* Ahora se puede hacer scroll */
    -webkit-overflow-scrolling: touch;
  }
  .page {
    position: relative;
    min-height: 100vh;
    width: 100%;
    background: #1a0f0a url('fondo.jpg') center/cover no-repeat;
    background-position: center 20%;
    background-attachment: fixed; /* Fondo fijo al hacer scroll */
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding-bottom: 80px; /* Espacio para que el botón no quede pegado */
  }

  /* Contenedor de notificaciones */
  .notifications-container {
    position: fixed;
    top: 60px;
    left: 16px;
    right: 16px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
  }
  .notification {
    background: #ffffff;
    border-radius: 20px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.28);
    pointer-events: auto;
    opacity: 0;
    transform: translateY(-30px) scale(0.95);
    animation: slideIn 0.5s ease forwards;
  }
  .notification:nth-child(1) { animation-delay: 0.3s; }
  .notification:nth-child(2) { animation-delay: 1.4s; }
  .notification:nth-child(3) { animation-delay: 2.6s; }

  @keyframes slideIn {
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .notification img.avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
  }
  .notification .content { flex: 1; }
  .notification .name {
    font-weight: 700;
    font-size: 15px;
    color: #111;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .notification .message {
    font-size: 14px;
    color: #333;
    margin-top: 2px;
  }
  .notification .action {
    color: #e85d04;
    font-weight: 600;
    font-size: 14px;
    text-decoration: underline;
    margin-top: 3px;
    display: inline-block;
  }
  .green-dot {
    width: 10px;
    height: 10px;
    background: #22c55e;
    border-radius: 50%;
    position: absolute;
    bottom: 1px;
    left: 36px;
    border: 2px solid white;
  }

  /* Contenido principal */
  .hero-content {
    position: relative;
    text-align: center;
    color: white;
    text-shadow: 0 2px 14px rgba(0,0,0,0.7);
    padding: 0 20px 20px;
    z-index: 5;
    margin-top: auto;
  }
  .title {
    font-size: 46px;
    font-weight: 800;
    letter-spacing: -0.5px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 21px;
    font-style: italic;
    font-weight: 400;
    opacity: 0.95;
    margin-bottom: 16px;
  }
  .badge {
    display: inline-block;
    background: #ff2d2d;
    color: white;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 18px;
    text-transform: uppercase;
  }
  .telegram-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(90deg, #ff6b1a, #ff3d00);
    color: white;
    font-size: 20px;
    font-weight: 800;
    padding: 18px 42px;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 10px 30px rgba(255, 80, 0, 0.45);
    min-width: 280px;
    transition: transform 0.15s ease;
  }
  .telegram-btn:active {
    transform: scale(0.96);
  }
  .telegram-btn svg {
    width: 28px;
    height: 28px;
    fill: white;
  }

  .bottom-gradient {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60%;
    background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
    pointer-events: none;
    z-index: 1;
  }

  /* Espacio extra para poder hacer scroll */
  .scroll-spacer {
    height: 120px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="bottom-gradient"></div>

  <!-- Notificaciones animadas -->
  <div class="notifications-container">
    <div class="notification">
      <div style="position:relative;">
        <img class="avatar" src="https://i.imgur.com/avatar-placeholder.jpg" alt="avatar">
        <div class="green-dot"></div>
      </div>
      <div class="content">
        <div class="name">Zorrito dulce 🦊</div>
        <div class="message">te envió una foto privada 📷</div>
        <a href="#" class="action">Abrir chat</a>
      </div>
    </div>

    <div class="notification">
      <div style="position:relative;">
        <img class="avatar" src="https://i.imgur.com/avatar-placeholder.jpg" alt="avatar">
        <div class="green-dot"></div>
      </div>
      <div class="content">
        <div class="name">Zorrito dulce 🦊</div>
        <div class="message">Nuevo mensaje 💬</div>
        <a href="#" class="action">Ver ahora</a>
      </div>
    </div>

    <div class="notification">
      <div style="position:relative;">
        <img class="avatar" src="https://i.imgur.com/avatar-placeholder.jpg" alt="avatar">
        <div class="green-dot"></div>
      </div>
      <div class="content">
        <div class="name">Zorrito dulce 🦊</div>
        <div class="message">¿Estás ahí? 🦊</div>
        <a href="#" class="action">Responder</a>
      </div>
    </div>
  </div>

  <!-- Contenido principal (más arriba) -->
  <div class="hero-content">
    <div class="title">Zorrito dulce <span style="font-size:40px;">🦊</span></div>
    <div class="subtitle">Lo que sólo verás aquí</div>
    <div class="badge">PERSONAJE</div>
    <a href="https://t.me/TU_USUARIO_TELEGRAM" class="telegram-btn" id="telegramBtn">
      <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15.91L16.1 19.45c-.23.74-1.06.91-1.57.5l-4.15-3.35-1.99 1.93c-.23.23-.42.42-.86.42z"/></svg>
      MI TELEGRAM
    </a>
  </div>

  <div class="scroll-spacer"></div>
</div>

<script>
  document.getElementById('telegramBtn').addEventListener('click', function() {
    console.log('Click en Telegram');
  });
</script>
</body>
</html>
