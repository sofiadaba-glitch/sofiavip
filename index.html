<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sofía 😈</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .page {
    position: relative;
    min-height: 100vh;
    width: 100%;
    background: #1a0f0a url('fondo.jpg') center/cover no-repeat;
    background-position: center 20%;
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding-bottom: 90px;
  }

  /* Notificación única que cicla */
  .notification-slot {
    position: fixed;
    top: 40px;
    left: 16px;
    right: 16px;
    z-index: 100;
    pointer-events: none;
  }
  .notification {
    background: #ffffff;
    border-radius: 20px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.28);
    pointer-events: auto;
    opacity: 0;
    transform: translateY(-20px) scale(0.96);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .notification.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .notification img.avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
  }
  .notification .content { flex: 1; }
  .notification .name {
    font-weight: 700;
    font-size: 15.5px;
    color: #111;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .notification .message {
    font-size: 14.5px;
    color: #333;
    margin-top: 2px;
  }
  .notification .action {
    color: #e85d04;
    font-weight: 600;
    font-size: 14.5px;
    text-decoration: underline;
    margin-top: 4px;
    display: inline-block;
  }
  .green-dot {
    width: 10px;
    height: 10px;
    background: #22c55e;
    border-radius: 50%;
    position: absolute;
    bottom: 2px;
    left: 38px;
    border: 2px solid white;
  }

  /* Contenido principal */
  .hero-content {
    position: relative;
    text-align: center;
    color: white;
    text-shadow: 0 2px 14px rgba(0,0,0,0.7);
    padding: 0 20px 10px;
    z-index: 5;
    margin-top: auto;
  }
  .title {
    font-size: 48px;
    font-weight: 800;
    letter-spacing: -0.5px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 22px;
    font-style: italic;
    font-weight: 400;
    opacity: 0.95;
    margin-bottom: 16px;
  }
  .badge {
    display: inline-block;
    background: #ff2d2d;
    color: white;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.2px;
    padding: 6px 16px;
    border-radius: 999px;
    margin-bottom: 18px;
    text-transform: uppercase;
  }

  /* Botón con animación de rebote */
  .telegram-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(90deg, #ff6b1a, #ff3d00);
    color: white;
    font-size: 20px;
    font-weight: 800;
    padding: 18px 42px;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 10px 30px rgba(255, 80, 0, 0.45);
    min-width: 280px;
    animation: bounce 2s infinite;
  }
  .telegram-btn:active {
    transform: scale(0.96);
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  .telegram-btn svg {
    width: 28px;
    height: 28px;
    fill: white;
  }

  .bottom-gradient {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60%;
    background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
    pointer-events: none;
    z-index: 1;
  }
  .scroll-spacer {
    height: 100px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="bottom-gradient"></div>

  <!-- Una sola notificación que cambia -->
  <div class="notification-slot">
    <div class="notification" id="notif">
      <div style="position:relative;">
        <img class="avatar" src="avatar.jpg" alt="Sofía">
        <div class="green-dot"></div>
      </div>
      <div class="content">
        <div class="name" id="notifName">Sofía 😈</div>
        <div class="message" id="notifMsg">te envió una foto privada 📷</div>
        <a href="https://t.me/sofiadab4" class="action" id="notifAction" target="_blank">Abrir chat</a>
      </div>
    </div>
  </div>

  <!-- Contenido principal -->
  <div class="hero-content">
    <div class="title">Sofía <span style="font-size:42px;">😈</span></div>
    <div class="subtitle">Lo que sólo verás aquí</div>
    <a href="https://t.me/sofiadab4" class="telegram-btn" id="telegramBtn" target="_blank">
      <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15.91L16.1 19.45c-.23.74-1.06.91-1.57.5l-4.15-3.35-1.99 1.93c-.23.23-.42.42-.86.42z"/></svg>
      MI TELEGRAM
    </a>
  </div>

  <div class="scroll-spacer"></div>
</div>

<script>
  const messages = [
    { msg: "te envió una foto privada 📷", action: "Abrir chat" },
    { msg: "Nuevo mensaje 💬", action: "Ver ahora" },
    { msg: "Tengo algo exclusivo para ti 🔥", action: "Ver VIP" }
  ];

  let index = 0;
  const notif = document.getElementById('notif');
  const notifMsg = document.getElementById('notifMsg');
  const notifAction = document.getElementById('notifAction');
  let intervalId;

  function showNext() {
    if (index >= messages.length) {
      clearInterval(intervalId);
      return;
    }
    notif.classList.remove('show');
    setTimeout(() => {
      const current = messages[index];
      notifMsg.textContent = current.msg;
      notifAction.textContent = current.action;
      notif.classList.add('show');
      index++;
    }, 400);
  }

  // Primera aparición
  setTimeout(() => {
    notif.classList.add('show');
    index = 1;
  }, 600);

  // Cambiar cada 10 segundos, solo hasta el tercer mensaje
  intervalId = setInterval(showNext, 10000);

  document.getElementById('telegramBtn').addEventListener('click', function() {
    console.log('Click en Telegram');
  });
</script>
</body>
</html>
